name: Discover permit sources
 
# Manual only. Searches Donnees Quebec for municipal permit datasets and prints
# ready-to-paste SOURCES entries. Commits nothing.
on:
  workflow_dispatch:
 
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python discover_sources.py
 
